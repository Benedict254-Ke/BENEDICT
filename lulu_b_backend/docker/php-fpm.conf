[global]
daemonize = no
error_log = /proc/self/fd/2
log_level = warning

[www]
listen = 0.0.0.0:9000
access.log = /proc/self/fd/1
user = www-data
group = www-data
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
catch_workers_output = yes
