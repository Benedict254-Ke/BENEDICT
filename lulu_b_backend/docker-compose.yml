version: '3.8'

services:
  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - .:/var/www/html:ro
    depends_on:
      - php-fpm
    environment:
      - NGINX_HOST=0.0.0.0
      - NGINX_PORT=80

  php-fpm:
    build: .
    volumes:
      - .:/var/www/html
    expose:
      - "9000"
    environment:
      - APP_ENV=production