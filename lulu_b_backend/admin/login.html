<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login — Lulu B</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- Simple modern styles -->
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#2563eb;--muted:#94a3b8;--white:#f8fafc}
    *{box-sizing:border-box;font-family:'Poppins',sans-serif}
    body{margin:0;background:linear-gradient(180deg,#021026 0%, #081426 100%);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:100%;max-width:420px;background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));border-radius:12px;padding:28px;box-shadow:0 10px 30px rgba(2,6,23,0.6)}
    h1{margin:0 0 10px;font-size:22px}
    p.lead{margin:0 0 20px;color:var(--muted);font-size:14px}
    .form-group{margin-bottom:14px}
    label{display:block;font-size:13px;margin-bottom:6px;color:var(--muted)}
    input{width:100%;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--white);outline:none}
    button{width:100%;padding:12px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;margin-top:8px}
    .alert{padding:10px;border-radius:8px;margin-bottom:12px;font-size:14px}
    .alert.error{background:rgba(255,0,0,0.08);color:#ffb4b4;border:1px solid rgba(255,0,0,0.12)}
    .alert.success{background:rgba(0,255,0,0.04);color:#b6f0b6;border:1px solid rgba(0,255,0,0.06)}
    .foot{margin-top:14px;text-align:center;color:var(--muted);font-size:13px}
    a.small{color:var(--muted);text-decoration:none}
  </style>
</head>
<body>
  <div class="card" role="main">
    <h1>Admin Login</h1>
    <p class="lead">Welcome back — sign in to manage messages and projects.</p>

    <div id="msg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required value="admin">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required value="123456">
      </div>

      <button type="submit">Sign In</button>
    </form>

    <div class="foot">
      <small>Use admin / 123456 (change later in DB)</small><br>
      <a class="small" href="../">Back to site</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.innerHTML = '';

  const formData = new FormData(form);
  const response = await fetch('../api/login.php', {
    method: 'POST',
    body: formData
  });

  const text = await response.text();

  if (text.trim() === "success") {
    msg.innerHTML = '<div class="alert success">Login successful! Redirecting...</div>';
    setTimeout(() => {
      window.location.href = 'dashboard.php';
    }, 800);
  }
  else if (text.trim() === "invalid_password") {
    msg.innerHTML = '<div class="alert error">Incorrect password.</div>';
  }
  else if (text.trim() === "invalid_user") {
    msg.innerHTML = '<div class="alert error">User not found.</div>';
  }
  else {
    msg.innerHTML = '<div class="alert error">Unexpected error. Response: ' + text + '</div>';
  }
});
  </script>
